<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>poster factory</title>
<style>
@font-face{
  font-family:"Monument Grotesk";
  src:local("Monument Grotesk"),local("MonumentGrotesk");
  font-weight:100 900;
}
:root{--bg:#000;--fg:#f1f1f1;--muted:#a7a7a7;--gap:10px;--pad:25px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Monument Grotesk","Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;padding:16px var(--pad) 82px}
header{height:23px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:start;color:#aaa;font-size:12px;letter-spacing:.055em;font-weight:500}
header span:nth-child(2){text-align:center}
header span:nth-child(3){text-align:right}
header button{border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;padding:0;cursor:pointer;text-align:left}
#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);align-items:start}
.tile{min-width:0;cursor:pointer}
.poster{width:100%;aspect-ratio:1000/1414;background:#fff;display:block;object-fit:contain}
.meta{display:flex;gap:18px;justify-content:space-between;align-items:baseline;min-height:31px;padding-top:5px;color:#aaa;font-size:12px;line-height:1.15;letter-spacing:.025em}
.meta .people{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
.meta .recipe{text-align:left;flex:1}
.empty{aspect-ratio:1000/1414;background:#fff}
#bottom{
  position:fixed;z-index:10;bottom:17px;left:3%;right:3%;
  height:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:4px 18px 5px 18px;pointer-events:auto;
  background:rgba(190,188,188,.88);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-radius:5px;
}
#brand{font-size:15px;font-weight:500;letter-spacing:-.02em;color:#080808;justify-self:start}
#status{position:static;z-index:auto;display:block;font-size:11px;color:#333;pointer-events:none;white-space:nowrap;text-align:center;justify-self:center}
#modes{display:flex;align-items:center;gap:28px;justify-self:end}
#modes button{border:0;background:none;color:#080808;font:inherit;font-size:15px;padding:4px 0;cursor:pointer;font-weight:500;letter-spacing:-.02em;}
#modes button.active{text-decoration:underline;text-underline-offset:4px}
#status{position:static;z-index:auto;display:block;font-size:11px;color:#333;pointer-events:none;white-space:nowrap;text-align:center;justify-self:center}
#upload{display:none}
body.dragging:after{content:"drop student folder";position:fixed;inset:12px;border:1px solid #aaa;background:rgba(0,0,0,.88);z-index:50;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.12em;color:#fff;pointer-events:none}
.placeholder{background:#fff;aspect-ratio:1000/1414}
.placeholder-meta{display:flex;gap:18px;min-height:31px;padding-top:5px;color:#777;font-size:12px;letter-spacing:.025em}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:20;display:none;align-items:center;justify-content:center;padding:24px}
#modal.open{display:flex}
#modalInner{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#largeCanvas{display:block;width:auto;height:auto;max-width:min(78vw,1100px);max-height:92vh;background:#fff;box-shadow:0 0 0 1px #222}
#details{position:absolute;top:4px;left:4px;width:230px;font-size:12px;line-height:1.55;color:#aaa}
#details strong{display:block;color:#eee;font-weight:500;margin-bottom:14px}
#details .line{margin:8px 0}
#details button,#close{border:0;background:none;color:#eee;font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
#close{position:absolute;top:20px;right:26px;font-size:13px;text-decoration:none; z-index:100;}
#prev,#next{position:absolute;top:50%;transform:translateY(-50%);border:0;background:none;color:#aaa;font:inherit;font-size:24px;cursor:pointer;padding:15px}
#prev{left:18px}#next{right:18px}
#setup{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:30;display:none;align-items:center;justify-content:center;padding:24px}
#setup.open{display:flex}
.panel{width:min(560px,100%);background:#111;padding:24px;border:1px solid #333}
.panel h2{font-size:15px;font-weight:500;margin:0 0 18px}
.panel p{font-size:12px;color:#aaa;line-height:1.5}
.panel label{display:block;font-size:11px;color:#aaa;margin:14px 0 6px}
.panel input,.panel textarea{width:100%;background:#050505;border:1px solid #444;color:#eee;padding:9px;font:inherit;font-size:12px}
.panel textarea{min-height:100px;resize:vertical}
.panel .actions{display:flex;justify-content:space-between;margin-top:18px}
.panel button{background:none;color:#eee;border:1px solid #555;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
@media(max-width:850px){:root{--pad:14px;--gap:7px}#grid{grid-template-columns:repeat(3,minmax(0,1fr))}.meta{font-size:10px;gap:8px}}
@media(max-width:560px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{font-size:10px}#modalInner{display:block}#details{margin-top:12px}#modal{padding:45px 35px}}
</style>
</head>
<body>
<header>
  <span>bezalel grid class</span>
  <span>haredi branch</span>
  <span>visual communication</span>
</header>
<input id="upload" type="file" accept="image/png,image/tiff,.png,.tif,.tiff" webkitdirectory multiple>
<main id="grid" aria-live="polite"></main>

<div id="bottom">
  <div id="brand">poster factory</div>
  <div id="status"></div>
  <nav id="modes">
    <button id="pairsBtn" class="active">pairs</button>
    <button id="randomBtn">shuffle</button>
  </nav>
</div>

<div id="modal">
  <button id="close">close ×</button>
  <button id="prev">‹</button>
  <div id="modalInner">
    <canvas id="largeCanvas"></canvas>
    <div id="details"></div>
  </div>
  <button id="next">›</button>
</div>


<script>
const TYPES=["grid-images","grid-type","free-images","free-headline"];
const TYPE_LABEL={"grid-images":"grid images","grid-type":"grid type","free-images":"free images","free-headline":"free headline"};
const grid=document.getElementById('grid'), upload=document.getElementById('upload');
let assets=new Map(), pairs=[], mode='pairs', results=[], currentIndex=0, colorA='#00AEEF', colorB='#F04468';
function showPlaceholders(){
  grid.innerHTML='';
  for(let i=0;i<16;i++){
    const tile=document.createElement('article');tile.className='tile';
    const blank=document.createElement('div');blank.className='placeholder';
    const meta=document.createElement('div');meta.className='placeholder-meta';
    meta.innerHTML='<span>student + student</span><span>composition × composition</span>';
    tile.append(blank,meta);grid.append(tile);
  }
  document.getElementById('status').textContent='loading works/ folder…';
}


function keyName(s){return s.trim().toLowerCase().replace(/\s+/g,'-')}
function parseFile(file){
  const base=file.name.replace(/\.(png|tiff?|webp|jpe?g)$/i,'');
  const match=base.match(/^(pair[-_]?\d+)-(.+)-(grid-images|grid-type|free-images|free-headline)$/i);
  if(!match)return null;
  return {pair:keyName(match[1]),student:keyName(match[2]),type:match[3].toLowerCase(),file};
}
function loadManifest(){
  fetch('./works/manifest.json', {cache:'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(new Error('manifest missing')))
    .then(items => {
      if (!Array.isArray(items) || !items.length) return;
      const files=items.map(item => ({
        name: item.name || item.file || item.url.split('/').pop(),
        url: item.url || new URL(item.name, window.location.href).href
      }));
      loadFiles(files, true);
    })
    .catch(() => {
      document.getElementById('status').textContent='No local works manifest found. Upload or drop images to begin.';
    });
}
function loadFiles(files, fromManifest=false){
  const list=[...files].filter(f=>/\.(png|tiff?|webp|jpe?g)$/i.test(f.name || ''));
  assets.clear();
  const rejected=[];
  const tasks=[];
  list.forEach(file=>{
    const parsed=parseFile(file);
    if(!parsed){rejected.push(file.name);return}
    const url=file.url || URL.createObjectURL(file);
    const img=new Image();
    tasks.push(new Promise(resolve=>{
      img.onload=()=>{
        assets.set(parsed.student+'|'+parsed.type,{...parsed,img,url});
        resolve();
      };
      img.onerror=()=>{
        rejected.push(file.name+' (could not read image)');
        if (!fromManifest && file.url === undefined) URL.revokeObjectURL(url);
        resolve();
      };
      img.src=url;
    }));
  });
  document.getElementById('status').style.display='block';
  document.getElementById('status').textContent=`Reading ${tasks.length} matching images…`;
  Promise.all(tasks).then(()=>{
    buildPairs(); makePairResults(); render();
    const unmatched=rejected.length?` · ignored: ${rejected.join(', ')}`:'';
    document.getElementById('status').textContent=`${assets.size} layers loaded · ${pairs.length} pairs · ${results.length} compositions${unmatched}`;
    document.getElementById('status').style.display='block';
    if(!assets.size){
      document.getElementById('status').textContent='No files recognized. Expected: pair01-haya-grid-images.png';
    }
  });
}
function buildPairs(){
  const grouped=new Map();
  for(const item of assets.values()){
    if(!grouped.has(item.pair))grouped.set(item.pair,new Set());
    grouped.get(item.pair).add(item.student);
  }
  pairs=[...grouped.entries()].flatMap(([pair,names])=>{
    const students=[...names].sort();
    return students.length===2?[{one:students[0],two:students[1],ca:colorA,cb:colorB}]:[];
  });
}
function layer(student,type,color){const a=assets.get(student+'|'+type);return a?{student,type,img:a.img,color}:null}
function composition(a,b,kind){return {a,b,kind,label:`${TYPE_LABEL[a.type]} × ${TYPE_LABEL[b.type]}`}}
function makePairResults(){
  results=[];
  for(const pair of pairs){
    const {one,two,ca,cb}=pair;
    const combos=[['grid-images','grid-type'],['free-images','grid-type'],['free-headline','grid-type'],['free-headline','grid-images']];
    combos.forEach(([ta,tb])=>{
      const a=layer(one,ta,ca),b=layer(two,tb,cb);
      if(a&&b)results.push(composition(a,b,'pairs'));
      const c=layer(two,ta,cb),d=layer(one,tb,ca);
      if(c&&d)results.push(composition(c,d,'pairs'));
    });
  }
}
function randomResults(){
  const students=[...new Set([...assets.values()].map(x=>x.student))], out=[], seen=new Set();
  const count=results.length||students.length*4;
  let attempts=0;
  while(out.length<count&&attempts<count*30){
    attempts++;
    if(students.length<2)break;
    const s1=students[Math.floor(Math.random()*students.length)],s2=students[Math.floor(Math.random()*students.length)];
    if(s1===s2)continue;
    const base= Math.random()<.5 ? 'grid-images' : 'grid-images';
    const other=TYPES[Math.floor(Math.random()*TYPES.length)];
    const reverse=Math.random()<.5;
    const a=layer(s1,base,Math.random()<.5?colorA:colorB);
    const b=layer(s2,other,a?.color===colorA?colorB:colorA);
    if(!a||!b)continue;
    const sig=[s1,base,s2,other].join('|'); if(seen.has(sig))continue;seen.add(sig);
    out.push(composition(a,b,'random'));
  }
  results=out;
}
function drawToCanvas(canvas,item){
  const a=item.a.img,b=item.b.img;
  const w=a.naturalWidth||1000,h=a.naturalHeight||1414;
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation='multiply';
  ctx.globalAlpha=1;
  // Preserve original grayscale artwork; combine the two images using multiply only.
  ctx.drawImage(a,0,0,w,h);
  ctx.drawImage(b,0,0,w,h);
  ctx.globalCompositeOperation='source-over';
}
function render(){
  grid.innerHTML='';
  results.forEach((item,i)=>{
    const tile=document.createElement('article');tile.className='tile';
    const canvas=document.createElement('canvas');canvas.className='poster';
    drawToCanvas(canvas,item);
    const meta=document.createElement('div');meta.className='meta';
    const people=document.createElement('span');people.className='people';people.textContent=`${item.a.student} + ${item.b.student}`;
    const recipe=document.createElement('span');recipe.className='recipe';recipe.textContent=item.label;
    meta.append(people,recipe);tile.append(canvas,meta);
    tile.addEventListener('click',()=>openModal(i));
    grid.append(tile);
  });
  document.getElementById('status').textContent=results.length?`${results.length} compositions`:'No matching layers yet · load a folder';
}
function setMode(next){
  mode=next;
  document.getElementById('pairsBtn').classList.toggle('active',mode==='pairs');
  document.getElementById('randomBtn').classList.toggle('active',mode==='random');
  if(mode==='pairs')makePairResults();else randomResults();
  render();
}
function openModal(i){currentIndex=i;showModal()}
function showModal(){
  if(!results[currentIndex])return;
  const item=results[currentIndex],c=document.getElementById('largeCanvas');
  drawToCanvas(c,item);
  const d=document.getElementById('details');
  d.innerHTML=`<strong>composition ${String(currentIndex+1).padStart(2,'0')} / ${mode}</strong>
  <div class="line">${item.a.student} / ${TYPE_LABEL[item.a.type]}</div>
  <div class="line">${item.b.student} / ${TYPE_LABEL[item.b.type]}</div>
  <div class="line">grayscale × grayscale / multiply</div>
  <div class="line" style="margin-top:24px"><button id="downloadOne">↓ download png</button></div>`;
  document.getElementById('downloadOne').onclick=()=>downloadCanvas(c,`poster-factory-${currentIndex+1}.png`);
  document.getElementById('modal').classList.add('open');
}
function downloadCanvas(canvas,name){canvas.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')}
document.getElementById('pairsBtn').onclick=()=>setMode('pairs');
document.getElementById('randomBtn').onclick=()=>setMode('random');
upload.onchange=e=>loadFiles(e.target.files);
// If the project is being served from a repo/static host, try the bundled works folder automatically.
loadManifest();
// Drop a folder or its image files anywhere on the page.
document.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';document.body.classList.add('dragging')});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dragging')});
document.addEventListener('drop',async e=>{
  e.preventDefault();
  document.body.classList.remove('dragging');
  const collected=[];
  const items=[...(e.dataTransfer?.items||[])];
  const walk=async entry=>{
    if(entry.isFile){
      const file=await new Promise(resolve=>entry.file(resolve));
      collected.push(file);return;
    }
    if(entry.isDirectory){
      const reader=entry.createReader();
      while(true){
        const batch=await new Promise(resolve=>reader.readEntries(resolve));
        if(!batch.length)break;
        await Promise.all(batch.map(walk));
      }
    }
  };
  if(items.length && items.some(item=>item.webkitGetAsEntry?.())){
    await Promise.all(items.map(async item=>{
      const entry=item.webkitGetAsEntry?.();
      if(entry)await walk(entry);
      else {const file=item.getAsFile?.();if(file)collected.push(file)}
    }));
    loadFiles(collected);
  }else{
    loadFiles(e.dataTransfer.files);
  }
});
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('prev').onclick=()=>{currentIndex=(currentIndex-1+results.length)%results.length;showModal()};
document.getElementById('next').onclick=()=>{currentIndex=(currentIndex+1)%results.length;showModal()};
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){document.getElementById('modal').classList.remove('open')}
 if(document.getElementById('modal').classList.contains('open')&&e.key==='ArrowRight'){currentIndex=(currentIndex+1)%results.length;showModal()}
 if(document.getElementById('modal').classList.contains('open')&&e.key==='ArrowLeft'){currentIndex=(currentIndex-1+results.length)%results.length;showModal()}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});

showPlaceholders();

// Auto-load sibling works/ folder when opened through the included local server.
async function autoLoadWorks(){
  try{
    const response=await fetch('./works/');
    if(!response.ok)throw new Error('works folder not found');
    const html=await response.text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    const links=[...doc.querySelectorAll('a[href]')]
      .map(a=>a.getAttribute('href'))
      .filter(h=>h && /\.(png|tiff?|webp|jpe?g)$/i.test(h));
    if(!links.length){
      document.getElementById('status').textContent='works/ folder found, but no image files were found.';
      document.getElementById('status').style.display='block';
      return;
    }
    const files=await Promise.all(links.map(async href=>{
      const r=await fetch('./works/'+encodeURIComponent(decodeURIComponent(href)));
      if(!r.ok)throw new Error('Could not load '+href);
      const blob=await r.blob();
      return new File([blob],decodeURIComponent(href),{type:blob.type||'image/png'});
    }));
    loadFiles(files);
  }catch(err){
    document.getElementById('status').textContent='Place your PNGs in a folder named works next to index.html. Open using start.command.';
    document.getElementById('status').style.display='block';
  }
}
autoLoadWorks();

</script>
</body>
</html>
